name: Repository analysis checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: investigator-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: investigator-be/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm test -- --runInBand
      - run: npm run build
